<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MikiIA</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet" />

  <!-- marked: convierte el Markdown de la IA (**negritas**, ###) en HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <!-- DOMPurify: limpia ese HTML para que nadie pueda inyectar código malicioso -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>MikiIA</h1>
    <div>
      <span id="quien"></span>
      <button type="button" class="boton-texto" id="nueva">Nueva conversación</button>
      <button type="button" class="boton-texto" id="salir">Cerrar sesión</button>
    </div>
  </header>

  <main id="scroll">
    <div id="mensajes" aria-live="polite"></div>
  </main>

  <form id="form-chat">
    <textarea id="entrada" rows="1" placeholder="Pregúntale algo a tu tutor…" aria-label="Tu mensaje"></textarea>
    <button type="submit" class="boton-enviar" id="enviar">Enviar</button>
  </form>

  <!-- Pantalla de acceso: entrar o crear cuenta -->
  <div id="pantalla-acceso" hidden>
    <form id="form-acceso">
      <h2 id="acceso-titulo">Entra a tu tutor</h2>

      <label for="acceso-usuario">Correo electrónico</label>
      <input id="acceso-usuario" type="email" autocomplete="username" required placeholder="tucorreo@gmail.com" />

      <label for="acceso-contrasena">Contraseña</label>
      <input id="acceso-contrasena" type="password" autocomplete="current-password" required />

      <div id="campo-codigo" hidden>
        <label for="acceso-codigo">Código de invitación</label>
        <input id="acceso-codigo" autocomplete="off" />
      </div>

      <p id="acceso-error" class="acceso-error" role="alert"></p>

      <button type="submit" class="boton-enviar" id="acceso-boton">Entrar</button>
      <button type="button" class="boton-texto" id="acceso-cambiar">Crear una cuenta</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
